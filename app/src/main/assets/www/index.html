<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Pintar SD</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one narrow column on a sunny sky-to-sand playground; one screen per step, big colourful tap targets.
   Deliberately single bright theme (kid-facing): every colour set explicitly so it reads the same on any host. */
:root{
  --paper:#fff9e8; --sky:#bfe8ff; --ink:#2b2350; --muted:#6a6191;
  --card:#ffffff; --border:#ece6ff;
  --math:#ff7a1a; --math-2:#ffb800; --math-soft:#fff0d6;
  --eng:#00b3a4; --eng-2:#3b82f6; --eng-soft:#d9f7f3;
  --c1:#ff5c8a; --c2:#ffb800; --c3:#22c55e; --c4:#3b82f6; --c5:#a855f7; --c6:#00b3a4;
  --c1s:#ffe3ec; --c2s:#fff3cc; --c3s:#dcfce7; --c4s:#dbeafe; --c5s:#f3e8ff; --c6s:#d9f7f3;
  --good:#16a34a; --good-soft:#dcfce7; --bad:#e11d48; --bad-soft:#ffe4e9; --star:#ffc107;
  --f-display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,sans-serif;
  --r:22px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.5;
  background-image:
    radial-gradient(circle at 12% 8%,#ffffffcc 0 40px,transparent 41px),
    radial-gradient(circle at 20% 6%,#ffffffcc 0 28px,transparent 29px),
    radial-gradient(circle at 85% 14%,#ffffffb3 0 34px,transparent 35px),
    radial-gradient(#ffd46655 2px,transparent 2.5px),
    linear-gradient(180deg,var(--sky) 0,#e6f6ff 260px,var(--paper) 520px);
  background-size:auto,auto,auto,26px 26px,auto;
  background-attachment:fixed;
}
.wrap{max-width:560px;margin:0 auto;padding-block:16px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  position:relative}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--eng);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.7rem;letter-spacing:.2px;display:flex}
.brand b{font-weight:700}
.brand b:nth-child(1){color:var(--c1)}.brand b:nth-child(2){color:var(--math)}.brand b:nth-child(3){color:var(--c2)}.brand b:nth-child(4){color:var(--c3)}.brand b:nth-child(5){color:var(--c4)}.brand b:nth-child(6){color:var(--c5)}
.brand span{margin-left:6px;background:var(--c5);color:#fff;border-radius:10px;padding:0 8px;font-size:1.2rem;align-self:center;transform:rotate(-6deg)}
.stars{display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:700;background:var(--star);color:#5a3b00;border-radius:999px;padding:6px 16px;font-variant-numeric:tabular-nums;box-shadow:0 4px 0 #e0a000}
.stars svg{width:22px;height:22px;fill:#fff}

.hello{margin-bottom:18px}
.hello h2{font-size:1.9rem}
.hello p{margin:4px 0 0;color:var(--muted)}
.field{display:grid;gap:8px;margin-bottom:18px}
.lbl{font-weight:800;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
input[type=text]{font:inherit;font-size:1.1rem;padding:12px 14px;border-radius:14px;border:3px solid var(--border);background:var(--card);color:var(--ink);width:100%}
input[type=text]:focus{border-color:var(--c5);outline:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{--cc:var(--c4);--cs:var(--c4s);min-width:52px;padding:10px 14px;border-radius:14px;border:3px solid var(--cc);background:var(--cs);color:var(--ink);font-family:var(--f-display);font-weight:600;font-size:1.15rem;transition:transform .12s}
.chip:active{transform:scale(.94)}
.chips .chip:nth-child(6n+1){--cc:var(--c1);--cs:var(--c1s)}.chips .chip:nth-child(6n+2){--cc:var(--math);--cs:var(--math-soft)}.chips .chip:nth-child(6n+3){--cc:var(--c2);--cs:var(--c2s)}
.chips .chip:nth-child(6n+4){--cc:var(--c3);--cs:var(--c3s)}.chips .chip:nth-child(6n+5){--cc:var(--c4);--cs:var(--c4s)}.chips .chip:nth-child(6n+6){--cc:var(--c5);--cs:var(--c5s)}
.chip.sm{font-size:.95rem;padding:8px 12px}
.chip[aria-pressed=true]{background:var(--cc);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--cc) 70%,#000);transform:translateY(-2px)}
.note{font-size:.85rem;color:var(--muted);margin:0}

.subjects{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
@media (max-width:420px){.subjects{grid-template-columns:1fr}}
.subj{position:relative;overflow:hidden;text-align:left;border:none;border-radius:var(--r);padding:20px;display:grid;gap:6px;min-height:170px;align-content:start;color:#fff;transition:transform .15s}
.subj::after{content:"";position:absolute;right:-30px;bottom:-30px;width:120px;height:120px;border-radius:50%;background:#ffffff2e}
.subj:hover{transform:translateY(-3px) rotate(-.5deg)}
.subj:active{transform:scale(.97)}
.subj .glyph{font-family:var(--f-display);font-size:2.3rem;font-weight:700;line-height:1;text-shadow:0 3px 0 #0000001f}
.subj h3{font-size:1.45rem}
.subj p{margin:0;font-size:.95rem;font-weight:700;opacity:.95}
.subj.math{background:linear-gradient(135deg,var(--math-2),var(--math) 60%,var(--c1));box-shadow:0 6px 0 #d4580a}
.subj.eng{background:linear-gradient(135deg,var(--eng),var(--eng-2) 70%,var(--c5));box-shadow:0 6px 0 #1f5fc4}
.best{font-size:.82rem;font-weight:800;margin-top:4px;background:#ffffff40;border-radius:999px;padding:2px 10px;justify-self:start}
.best:empty{display:none}

.back{background:none;border:none;color:var(--muted);font-weight:800;padding:6px 0;margin-bottom:8px;display:inline-flex;gap:6px;align-items:center}
.section-title{font-size:1.6rem;margin-bottom:4px}
.sub{color:var(--muted);margin:0 0 16px}
.group-lbl{margin:18px 0 8px}
.list{display:grid;gap:10px}
.opt-row{--cc:var(--c4);--cs:var(--c4s);display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 14px;border-radius:18px;border:3px solid var(--cs);background:var(--card);box-shadow:0 4px 0 var(--cs);transition:transform .12s}
.opt-row:hover{border-color:var(--cc)}
.opt-row:active{transform:translateY(2px);box-shadow:0 2px 0 var(--cs)}
.list .opt-row:nth-child(6n+1){--cc:var(--c1);--cs:var(--c1s)}.list .opt-row:nth-child(6n+2){--cc:var(--c4);--cs:var(--c4s)}.list .opt-row:nth-child(6n+3){--cc:var(--c3);--cs:var(--c3s)}
.list .opt-row:nth-child(6n+4){--cc:var(--c5);--cs:var(--c5s)}.list .opt-row:nth-child(6n+5){--cc:var(--math);--cs:var(--math-soft)}.list .opt-row:nth-child(6n+6){--cc:var(--c6);--cs:var(--c6s)}
.opt-row .ic{font-size:1.6rem;width:50px;height:50px;border-radius:16px;display:grid;place-items:center;flex:none;background:var(--cs)}
.opt-row .ic.sym{font-family:var(--f-display);font-weight:700;font-size:1.35rem;background:var(--cc);color:#fff!important}
.opt-row>span:nth-child(2){min-width:0}
.opt-row b{display:block;font-family:var(--f-display);font-size:1.1rem;font-weight:600}
.opt-row small{color:var(--muted)}
.opt-row .mini{margin-left:auto;display:flex;gap:2px;flex:none}
.mini svg{width:16px;height:16px;fill:var(--border)}
.mini svg.on{fill:var(--star)}
.tag{display:inline-block;font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--eng);border:1px solid var(--eng);border-radius:999px;padding:0 8px;margin-left:6px;vertical-align:2px}

/* quiz */
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.bar{flex:1;height:16px;border-radius:99px;background:var(--card);border:3px solid var(--border);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3),var(--c4),var(--c5));background-size:400px 100%;border-radius:99px;transition:width .3s}
.count{font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums;color:#fff;background:var(--accent,var(--math));border-radius:999px;padding:2px 10px;font-size:.95rem}
.qcard{background:var(--card);border:4px solid var(--accent,var(--math));border-radius:26px;padding:24px 18px;text-align:center;margin-bottom:16px;box-shadow:0 6px 0 color-mix(in srgb,var(--accent,var(--math)) 35%,transparent)}
.qtext{font-family:var(--f-display);font-weight:600;font-size:clamp(2rem,9vw,3rem);font-variant-numeric:tabular-nums;line-height:1.2;word-break:break-word}
.qtext.small{font-size:clamp(1.15rem,5.2vw,1.55rem);line-height:1.35}
.blank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--accent,var(--eng));margin:0 .15em}
.qhint{color:var(--muted);margin-top:6px;font-weight:700}
.pic{font-size:5rem;line-height:1.1}
.swatch{width:110px;height:110px;border-radius:24px;margin:0 auto;border:3px solid var(--border)}
.clock{width:150px;height:150px;margin:0 auto 10px;display:block}
.speak{margin-top:12px;border:2px solid var(--eng);color:var(--eng);background:transparent;border-radius:999px;padding:8px 18px;font-weight:800}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ans{--cc:var(--c4);--cs:var(--c4s);min-height:72px;border-radius:20px;border:3px solid var(--cc);background:var(--cs);color:var(--ink);font-family:var(--f-display);font-weight:600;font-size:1.5rem;padding:8px;font-variant-numeric:tabular-nums;box-shadow:0 5px 0 var(--cc);transition:transform .1s,box-shadow .1s;word-break:break-word}
.answers .ans:nth-child(4n+1){--cc:var(--c1);--cs:var(--c1s)}.answers .ans:nth-child(4n+2){--cc:var(--c4);--cs:var(--c4s)}
.answers .ans:nth-child(4n+3){--cc:var(--c2);--cs:var(--c2s)}.answers .ans:nth-child(4n+4){--cc:var(--c5);--cs:var(--c5s)}
.ans.txt{font-size:1.12rem}
.ans.emoji{font-size:2.5rem}
.ans:active{transform:translateY(4px);box-shadow:0 1px 0 var(--cc)}
.ans:disabled{cursor:default;opacity:.55}
.ans.right,.ans.wrong{opacity:1}
.answers .ans.right{--cc:var(--good);--cs:var(--good-soft);color:var(--good);animation:bounce .45s}
.answers .ans.wrong{--cc:var(--bad);--cs:var(--bad-soft);color:var(--bad);animation:shake .4s}
@keyframes bounce{40%{transform:scale(1.08)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.feedback{min-height:56px;margin-top:16px;padding:12px 14px;border-radius:18px;font-family:var(--f-display);font-weight:600;font-size:1.1rem;text-align:center}
.feedback.ok{background:var(--good);color:#fff}
.feedback.no{background:var(--bad-soft);color:var(--bad);border:3px solid var(--bad)}
.feedback:empty{background:none;border:none}
.next{width:100%;margin-top:14px;padding:16px;border:none;border-radius:20px;background:linear-gradient(90deg,var(--c3),#10b981);color:#fff;font-family:var(--f-display);font-weight:700;font-size:1.25rem;box-shadow:0 5px 0 #0f8a4a}
.next:active{transform:translateY(3px);box-shadow:0 2px 0 #0f8a4a}

/* result */
.result{text-align:center;padding-top:10px}
.bigstars{display:flex;justify-content:center;gap:10px;margin:18px 0}
.bigstars svg{width:64px;height:64px;fill:var(--border)}
.bigstars svg.on{fill:var(--star);animation:pop .5s backwards}
.bigstars svg.on:nth-child(2){animation-delay:.15s}.bigstars svg.on:nth-child(3){animation-delay:.3s}
@keyframes pop{from{transform:scale(.3)}70%{transform:scale(1.15)}}
.result h2{font-size:2.1rem;color:var(--c5)}
.score{font-family:var(--f-display);font-size:3.4rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--c1)}
.review{text-align:left;margin-top:18px;display:grid;gap:6px}
.review div{background:var(--card);border:2px solid var(--c1s);border-radius:14px;padding:8px 12px;font-size:.95rem;font-weight:700}
.review .x{color:var(--bad);font-weight:800}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.ghost{padding:14px;border-radius:20px;border:3px solid var(--c4);background:var(--c4s);color:var(--c4);font-family:var(--f-display);font-weight:700;font-size:1.05rem;box-shadow:0 5px 0 var(--c4)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.hello h2{color:var(--ink)}
.section-title{color:var(--c5)}
.back{color:var(--c4)}
.mission{background:var(--c5s);border:3px dashed var(--c5);border-radius:20px;padding:14px 16px;margin:0 0 18px;font-weight:800;color:var(--ink);display:grid;gap:10px}
.mission b{font-family:var(--f-display);font-size:1.15rem;color:var(--c5)}
.mission .dots{display:flex;gap:6px}
.mission .dots i{width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--c5)}
.mission .dots i.on{background:var(--c3);border-color:var(--c3)}
#missionMsg{margin-top:16px;text-align:center}
.next.unlock{background:linear-gradient(90deg,var(--c1),var(--c5));box-shadow:0 5px 0 #8b2fc9;font-size:1.4rem;margin-bottom:6px}
.mixcard{position:relative;overflow:hidden;width:100%;display:flex;align-items:center;gap:14px;text-align:left;border:none;border-radius:var(--r);padding:18px;margin:6px 0 14px;color:#fff;background:linear-gradient(120deg,var(--c1),var(--c5));box-shadow:0 6px 0 #8b2fc9;transition:transform .15s}
.mixcard:active{transform:scale(.98)}
.mixcard .mixicon{font-size:2.4rem;flex:none}
.mixcard .mixtext{flex:1;min-width:0;display:grid;gap:2px}
.mixcard h3{font-size:1.45rem}
.mixcard p{margin:0;font-weight:700;font-size:.92rem;opacity:.95}
.mixcard .go{flex:none;background:#fff;color:var(--c5);font-family:var(--f-display);font-weight:700;border-radius:999px;padding:8px 14px}
@media (max-width:420px){.mixcard .go{display:none}}
.qtag{display:inline-block;font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#fff;background:var(--accent,var(--math));border-radius:999px;padding:2px 10px;margin-bottom:10px}
.parent-link{margin-top:10px;background:none;border:2px solid var(--border);border-radius:999px;padding:6px 14px;color:var(--muted);font-weight:800;font-size:.8rem}
.row2 .next{margin-top:0}
.foot{margin-top:28px;font-size:.8rem;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand" aria-label="Pintar SD"><b>P</b><b>i</b><b>n</b><b>t</b><b>a</b><b>r</b><span>SD</span></div>
    <div class="stars" title="Total bintang"><svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg><span id="totalStars">0</span></div>
  </header>

  <!-- HOME -->
  <section id="vHome">
    <div class="hello"><h2 id="helloText">Halo! Mau belajar apa hari ini?</h2><p>Kumpulkan bintang dari setiap latihan.</p></div>
    <div class="mission" id="mission" hidden></div>
    <div class="field"><label class="lbl" for="nameIn">Namamu</label><input id="nameIn" type="text" maxlength="20" placeholder="contoh: Dika" autocomplete="off"></div>
    <div class="field"><span class="lbl">Kelas</span><div class="chips" id="gradeChips"></div><p class="note" id="faseNote"></p></div>
    <div class="field"><span class="lbl">Pilih kurikulum</span><div class="chips" id="curChips"></div></div>
    <button class="mixcard" id="goMix"><span class="mixicon" aria-hidden="true">🎯</span><span class="mixtext"><h3>Misi campuran</h3><p>10 soal acak Matematika &amp; Bahasa Inggris, beda setiap hari</p><span class="best" id="mixBest"></span></span><span class="go">Mulai →</span></button>
    <div class="subjects">
      <button class="subj math" id="goMath"><span class="glyph">+ −<br>× ÷</span><h3>Matematika</h3><p id="mathDesc"></p><span class="best" id="mathBest"></span></button>
      <button class="subj eng" id="goEng"><span class="glyph">Aa</span><h3>Bahasa Inggris</h3><p id="engDesc"></p><span class="best" id="engBest"></span></button>
    </div>
  </section>

  <!-- MATH MENU -->
  <section id="vMath" hidden>
    <button class="back" data-go="home">← Kembali</button>
    <h2 class="section-title">Matematika</h2>
    <p class="sub" id="mathSub"></p>
    <div class="list" id="mathList"></div>
  </section>

  <!-- ENGLISH MENU -->
  <section id="vEng" hidden>
    <button class="back" data-go="home">← Kembali</button>
    <h2 class="section-title">Bahasa Inggris</h2>
    <p class="sub" id="engSub"></p>
    <div class="field"><span class="lbl">Level</span><div class="chips" id="engLevel"></div></div>
    <div class="field" id="modeField"><span class="lbl">Cara bermain tema bergambar</span><div class="chips" id="engMode"></div></div>
    <div class="list" id="engList"></div>
  </section>

  <!-- QUIZ -->
  <section id="vQuiz" hidden>
    <div class="qhead"><button class="back" id="quitQuiz" style="margin:0" aria-label="Keluar">✕</button><div class="bar"><i id="barFill"></i></div><span class="count" id="qCount">1/10</span></div>
    <div class="qcard"><div id="qBody"></div></div>
    <div class="answers" id="answers"></div>
    <div class="feedback" id="feedback" aria-live="polite"></div>
    <button class="next" id="nextBtn" hidden>Lanjut →</button>
  </section>

  <!-- RESULT -->
  <section id="vResult" hidden>
    <div class="result">
      <h2 id="resTitle">Hebat!</h2>
      <div class="bigstars" id="resStars"></div>
      <div class="score" id="resScore">0/10</div>
      <p class="sub" id="resMsg"></p>
      <p class="mission" id="missionMsg" hidden></p>
      <button class="next unlock" id="unlockBtn" hidden>Buka tablet 🎉</button>
      <div class="review" id="resReview"></div>
      <div class="row2"><button class="ghost" data-go="back">Pilih latihan</button><button class="next" id="againBtn">Ulangi</button></div>
    </div>
  </section>

  <p class="foot">Pilihan kurikulum: Merdeka (Fase A–C) atau Cambridge Primary (Stage 1–6)<br><button class="parent-link" id="parentLink" hidden>Menu orang tua</button></p>
</div>

<script>
(()=>{
const STAR='<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg>';
const KEY='pintar-sd-v1';
let S={name:'',grade:1,cur:'merdeka',best:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s) S=Object.assign(S,s);}catch(e){}
/* Mode aplikasi Android (layar kunci): pengaturan datang dari orang tua */
const NATIVE=window.Android||null;
let CFG=null;
const loadCfg=()=>{if(!NATIVE)return;try{CFG=JSON.parse(NATIVE.getConfig());S.grade=CFG.grade}catch(e){}};
loadCfg();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const gcd=(a,b)=>b?gcd(b,a%b):a;

/* ---------- clock ---------- */
function clockSVG(h,m){
  const ha=((h%12)+m/60)*30*Math.PI/180, ma=m*6*Math.PI/180;
  let nums='';for(let i=1;i<=12;i++){const a=i*30*Math.PI/180;nums+=`<text x="${60+42*Math.sin(a)}" y="${60-42*Math.cos(a)+5}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)" font-family="Fredoka,sans-serif">${i}</text>`}
  return `<svg class="clock" viewBox="0 0 120 120" role="img" aria-label="jam analog"><circle cx="60" cy="60" r="56" fill="var(--paper)" stroke="var(--ink)" stroke-width="4"/>${nums}
  <line x1="60" y1="60" x2="${60+26*Math.sin(ha)}" y2="${60-26*Math.cos(ha)}" stroke="var(--math)" stroke-width="6" stroke-linecap="round"/>
  <line x1="60" y1="60" x2="${60+40*Math.sin(ma)}" y2="${60-40*Math.cos(ma)}" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="60" cy="60" r="4" fill="var(--ink)"/></svg>`;
}

function numOpts(a,extra=[]){
  const s=new Set([a]);extra.forEach(v=>{if(v!==a&&v>=0&&Number.isFinite(v))s.add(v)});
  const spread=Math.max(3,Math.round(Math.abs(a)*.15));let g=0;
  while(s.size<4&&g++<200){const v=a+pick([-1,1])*rnd(1,spread);if(v>=0)s.add(v)}
  return shuffle([...s].slice(0,4));
}
function rpOpts(a,extra=[]){
  const s=new Set([a]);extra.forEach(v=>{if(v!==a&&v>0)s.add(v)});let g=0;

  while(s.size<4&&g++<200){const v=a+pick([-1,1])*step*rnd(1,4);if(v>0)s.add(v)}
  return shuffle([...s].slice(0,4)).map(rp);
}

/* ---------- variasi bentuk soal hitung: bilangan hilang, benar/salah, soal cerita, gambar ---------- */
const VARY_OK=new Set(['add10','sub10','add20','add100','sub100','mul10','div10','add1000','mul2d','div2d','tables25']);
const NAMES=['Ani','Budi','Siti','Rafi','Dina','Bayu','Laila','Putra','Nisa','Fajar'];
const ITEMS=['kelereng','permen','pensil','stiker','jeruk','buku','balon','kue'];
function varyMath(q,a){
  const m=/^(\d+) ([+−×÷]) (\d+)$/.exec(q);if(!m)return null;
  const x=+m[1],op=m[2],y=+m[3];if(x===0||y===0)return null;
  const full=`${x} ${op} ${y} = ${fmt(a)}`;
  const kinds=['hole2','hole1','tf','story','story'];
  if(op==='+'&&a<=10&&S.grade<=2)kinds.push('pic','pic');
  const k=pick(kinds);
  if(k==='hole2'||k==='hole1'){
    const ans=k==='hole2'?y:x,qq=k==='hole2'?`${x} ${op} ___ = ${fmt(a)}`:`___ ${op} ${y} = ${fmt(a)}`;
    return{q:qq,full:1,a:fmt(ans),opts:numOpts(ans,[a,k==='hole2'?x:y].filter(v=>v!==ans)).map(fmt),hint:'Bilangan berapa yang hilang?',review:full};
  }
  if(k==='tf'){
    const right=Math.random()<.5;let shown=a;
    if(!right){const ds=[-2,-1,1,2,op==='×'?x:10].filter(d=>a+d>=0&&d!==0);shown=a+pick(ds)}
    return{q:`${x} ${op} ${y} = ${fmt(shown)}`,full:1,a:right?'Benar':'Salah',opts:['Benar','Salah'],hint:'Benar atau salah?',review:full,explain:right?'':`Yang benar: ${full}`};
  }
  if(k==='pic'){
    const e=pick(['🍎','⭐','🐟','🎈','🍓','🐥','🚗','🌸']);
    return{q:`${x} + ${y} = ?`,full:1,html:`<div class="pic" style="font-size:34px;line-height:1.35;max-width:100%;overflow-wrap:anywhere">${e.repeat(x)} ➕ ${e.repeat(y)}</div>`,a:fmt(a),opts:numOpts(a).map(fmt),hint:'Hitung semua gambarnya'};
  }
  const nm=pick(NAMES),it=pick(ITEMS);let s,wrong;
  if(op==='+'){s=`${nm} punya ${x} ${it}. Lalu ${nm} mendapat ${y} ${it} lagi. Berapa ${it} ${nm} sekarang?`;wrong=Math.abs(x-y)}
  else if(op==='−'){s=`${nm} punya ${x} ${it}. Sebanyak ${y} ${it} diberikan kepada adik. Berapa sisa ${it} ${nm}?`;wrong=x+y}
  else if(op==='×'){s=`${nm} punya ${x} kantong. Setiap kantong berisi ${y} ${it}. Berapa jumlah semua ${it}?`;wrong=x+y}
  else{s=`${nm} membagi ${x} ${it} sama rata kepada ${y} teman. Setiap teman mendapat berapa ${it}?`;wrong=x-y}
  return{q:s,full:1,small:1,a:fmt(a),opts:numOpts(a,[wrong]).map(fmt),hint:'Tulis dulu kalimat matematikanya',review:`${s} → ${full}`};
}

const CAM={colors:1,numbers:1,animals:1,fruits:1,body:1,greet:1,family:1,school:1,food:2,actions:2,numbers2:2,days:2,jobs:2,places:2,opposites:2,time:3,months:3,grammar:3,past:3,compare:3};
const MODES=[{id:'mix',t:'🔀 Campur'},{id:'see',t:'Lihat → pilih kata'},{id:'word',t:'Kata → pilih gambar'},{id:'arti',t:'Kata → pilih arti'},{id:'idn',t:'Arti → pilih kata'},{id:'eja',t:'Pilih ejaan yang benar'}];

/* buat 3 ejaan salah yang mirip, untuk mode "Pilih ejaan yang benar" */
function misspell(w){
  const c=w.split(''),VW='aeiou',t=rnd(0,3),i=rnd(0,c.length-1);
  if(t===0&&c.length>3){if(i>=c.length-1||c[i]===' '||c[i+1]===' '||c[i]===c[i+1])return null;[c[i],c[i+1]]=[c[i+1],c[i]]}
  else if(t===1&&c.length>3){if(c[i]===' '||c[i]==='-')return null;c.splice(i,1)}
  else if(t===2){if(c[i]===' '||c[i]==='-')return null;c.splice(i,0,c[i])}
  else{const vs=c.map((ch,j)=>VW.includes(ch)?j:-1).filter(j=>j>=0);if(!vs.length)return null;const j=pick(vs);c[j]=pick(VW.replace(c[j],'').split(''))}
  return c.join('');
}
function spellOpts(w){const s=new Set([w]);let g=0;while(s.size<4&&g++<200){const m=misspell(w);if(m&&m.trim()===m&&!m.includes('  '))s.add(m)}return shuffle([...s])}

const LV=new Proxy({},{get:(t,k)=>(S.cur==='cam'?LVC:LVM)[k]});

  return big?`<div class="pic">${item[2]}</div>`:item[2];
}
function genVocab(cat){
  const pool=ENG[cat].w,item=pick(pool);
  return{cat,item,all:shuffle([item,...shuffle(pool.filter(x=>x!==item)).slice(0,3)])};
}

/* ---------- ingatan soal: soal yang sudah keluar tidak diulang selama 3 hari ---------- */
const RKEY='pintar-sd-recent',RECENT_MS=3*864e5;
let R={};try{R=JSON.parse(localStorage.getItem(RKEY)||'{}')||{}}catch(e){R={}}
const isRecent=k=>R[k]&&Date.now()-R[k]<RECENT_MS;
function markSeen(keys){
  const now=Date.now();keys.forEach(k=>R[k]=now);
  let ks=Object.keys(R).filter(k=>now-R[k]<RECENT_MS);
  if(ks.length>4000)ks=ks.sort((a,b)=>R[b]-R[a]).slice(0,4000);
  const nr={};ks.forEach(k=>nr[k]=R[k]);R=nr;
  try{localStorage.setItem(RKEY,JSON.stringify(R))}catch(e){}
}
/* buat satu soal; utamakan yang belum pernah keluar, kalau habis ambil yang paling lama */
function fresh(make,used){
  let best=null,bestT=Infinity;
  for(let i=0;i<40;i++){
    const q=make();if(used.has(q.key))continue;
    if(!isRecent(q.key))return q;
    if(R[q.key]<bestT){best=q;bestT=R[q.key]}
  }
  return best||make();
}
function makeQ(kind,id,mode){
  if(kind==='m'){const q=genMath(id);q.kind='m';q.topic=id;q.key='m|'+q.q+'|'+q.a;return q}
  if(kind==='t'){const q=ENG[id].gen();q.kind='t';q.cat=id;q.key='t|'+id+'|'+q.q+'|'+q.a;return q}
  const q=genVocab(id);q.kind='v';
  let md=mode||'mix';if(md==='mix')md=pick(MODES.filter(x=>x.id!=='mix')).id;
  q.mode=md;if(md==='eja')q.spell=spellOpts(q.item[0]);
  q.key='v|'+id+'|'+q.item[0];return q;
}

  const used=new Set(),qs=[];
  let slots=[];

    // 6 Matematika + 4 Bahasa Inggris, topik diputar supaya bervariasi
    const mt=shuffle(mathSet().map(m=>m.id)),et=shuffle(engCats());
    for(let i=0;i<6;i++)slots.push(['m',mt[i%mt.length]]);
    for(let i=0;i<4;i++){const c=et[i%et.length];slots.push([ENG[c].type==='v'?'v':'t',c])}
    slots=shuffle(slots);
  }else{
    for(let i=0;i<N;i++)slots.push([cfg.type,cfg.id,cfg.mode]);
  }
  slots.forEach(([k,id,mode])=>{const q=fresh(()=>makeQ(k,id,mode),used);used.add(q.key);qs.push(q)});
  markSeen(qs.map(q=>q.key));
  Q={cfg,qs,i:0,right:0,miss:[]};
  show('vQuiz');renderQ();
}
const blankify=s=>esc(s).replace('___','<span class="blank"></span>');
function renderQ(){
  const {qs,i}=Q,q=qs[i];
  document.documentElement.style.setProperty('--accent',q.kind==='m'?'var(--math)':'var(--eng)');
  $('qCount').textContent=`${i+1}/${N}`;$('barFill').style.width=(i/N*100)+'%';
  $('feedback').textContent='';$('feedback').className='feedback';$('nextBtn').hidden=true;
  let body='',btns='';
  const tag=Q.cfg.type==='mix'?`<div class="qtag">${q.kind==='m'?'Matematika':'Bahasa Inggris'}</div>`:'';
  if(q.kind==='v'){
    const {cat,item,all,mode}=q;
    if(mode==='see'){body=visual(cat,item,true)+`<div class="qhint">Apa bahasa Inggrisnya?</div>`;
      btns=all.map(o=>`<button class="ans txt" data-v="${esc(o[0])}">${esc(o[0])}</button>`).join('')}
    else if(mode==='eja'){body=visual(cat,item,true)+`<div class="qhint">Pilih tulisan bahasa Inggris yang benar</div>`;
      btns=q.spell.map(o=>`<button class="ans txt" data-v="${esc(o)}">${esc(o)}</button>`).join('')}
    else if(mode==='arti'){body=`<div class="qtext">${esc(item[0])}</div><div class="qhint">Apa artinya dalam bahasa Indonesia?</div><button class="speak" data-say="${esc(item[0])}">🔊 Dengarkan</button>`;
      btns=all.map(o=>`<button class="ans txt" data-v="${esc(o[0])}">${esc(o[1])}</button>`).join('')}
    else if(mode==='idn'){body=`<div class="qtext small">${esc(item[1])}</div><div class="qhint">Apa bahasa Inggrisnya?</div>`;
      btns=all.map(o=>`<button class="ans txt" data-v="${esc(o[0])}">${esc(o[0])}</button>`).join('')}
    else{
      body=mode==='word'?`<div class="qtext">${esc(item[0])}</div><div class="qhint">Pilih gambar yang tepat</div><button class="speak" data-say="${esc(item[0])}">🔊 Dengarkan</button>`
        :`<div class="pic" aria-hidden="true">🎧</div><div class="qhint">Dengarkan, lalu pilih gambarnya</div><button class="speak" data-say="${esc(item[0])}">🔊 Putar lagi</button>`;
      btns=all.map(o=>`<button class="ans ${cat==='colors'||cat.startsWith('numbers')?'':'emoji'}" data-v="${esc(o[0])}" aria-label="${mode==='hear'?'pilihan':esc(o[0])}">${visual(cat,o,false)}</button>`).join('');
      if(mode==='hear') setTimeout(()=>say(item[0]),250);
    }
  }else{
    body=(q.html||'')+`<div class="qtext ${q.small||q.kind==='t'?'small':''}">${blankify(q.q)}</div>${q.hint?`<div class="qhint">${esc(q.hint)}</div>`:''}`;
    const long=q.opts.some(o=>String(o).length>7);
    btns=q.opts.map(o=>`<button class="ans ${long||q.kind==='t'?'txt':''}" data-v="${esc(o)}">${esc(o)}</button>`).join('');
  }
  $('qBody').innerHTML=tag+body;$('answers').innerHTML=btns;
}
$('qBody').addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b)say(b.dataset.say)});
$('answers').addEventListener('click',e=>{
  const b=e.target.closest('.ans');if(!b||b.disabled)return;
  const q=Q.qs[Q.i];const correct=q.kind==='v'?q.item[0]:String(q.a);
  const ok=b.dataset.v===correct;
  [...$('answers').children].forEach(x=>{x.disabled=true;if(x.dataset.v===correct)x.classList.add('right')});
  if(!ok)b.classList.add('wrong');
  beep(ok);
  const fb=$('feedback');let msg;
  if(q.kind==='m'){
    msg=ok?pick(['Benar! Hebat!','Tepat sekali!','Pintar!','Mantap!']):`Belum tepat. Jawabannya ${q.a}.`+(q.explain?' '+q.explain:'');
    if(!ok)Q.miss.push(q.review?q.review:q.q.includes('= ?')?q.q.replace('= ?','= '+q.a):`${q.q} → ${q.a}`);
  }else if(q.kind==='v'){
    msg=(ok?pick(['Correct! ','Great job! ','Well done! ']):'Belum tepat. ')+`${q.item[0]} = ${q.item[1]}`;
    if(q.mode!=='hear'||!ok)say(q.item[0]);
    if(!ok)Q.miss.push(`${q.item[0]} = ${q.item[1]}`);
  }else{
    msg=(ok?pick(['Correct! ','Great job! ','Well done! ']):`Jawabannya: ${q.a}. `)+(q.mean||'');
    say(q.say||q.a);
    if(!ok)Q.miss.push(q.review||`${q.q} → ${q.a}`);
  }
  fb.textContent=msg;fb.className='feedback '+(ok?'ok':'no');
  if(ok)Q.right++;
  $('nextBtn').hidden=false;$('nextBtn').textContent=Q.i===N-1?'Lihat hasil →':'Lanjut →';$('nextBtn').focus({preventScroll:true});
});
$('nextBtn').onclick=()=>{Q.i++;if(Q.i<N)renderQ();else finish()};
$('quitQuiz').onclick=()=>{try{speechSynthesis.cancel()}catch(e){};
  if(lastMenu==='math'){renderMath();show('vMath')}else if(lastMenu==='eng'){renderEng();show('vEng')}else{renderHome();show('vHome')}};
$('againBtn').onclick=()=>start(Q.cfg);
$('unlockBtn').onclick=()=>{try{NATIVE.unlock()}catch(e){}};
$('parentLink').onclick=()=>{try{NATIVE.openParent()}catch(e){}};
$('goMix').onclick=()=>{lastMenu='home';start({type:'mix'})};

function finish(){
  $('barFill').style.width='100%';
  const r=Q.right,stars=r>=9?3:r>=7?2:r>=5?1:0,isMix=Q.cfg.type==='mix';
  const key=isMix?'x:mix':Q.cfg.type==='m'?'m:'+Q.cfg.id:ekey(Q.cfg.id,Q.cfg.mode);
  const prev=S.best[key]||0;if(stars>prev){S.best[key]=stars;save()}
  $('totalStars').textContent=totalStars();
  const nm=S.name?`, ${S.name}`:'';
  $('resTitle').textContent=[`Ayo coba lagi${nm}!`,`Lumayan${nm}!`,`Bagus${nm}!`,`Hebat sekali${nm}!`][stars];
  $('resStars').innerHTML=starsRow(stars);
  $('resScore').textContent=`${r}/${N}`;
  $('resMsg').textContent=stars>prev&&prev>0?'Rekor baru! Bintangmu bertambah.':stars===3?'Sempurna. Coba latihan lain!':'Benar 9 soal untuk dapat 3 bintang.';
  if(stars>=2&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
    const box=document.createElement('div');box.className='confetti';const cols=['#ff5c8a','#ffb800','#22c55e','#3b82f6','#a855f7','#ff7a1a'];
    for(let k=0;k<70;k++){const p=document.createElement('i');p.style.left=Math.random()*100+'%';p.style.background=pick(cols);
      p.style.animationDuration=(1.6+Math.random()*1.6)+'s';p.style.animationDelay=Math.random()*.6+'s';box.appendChild(p)}
    document.body.appendChild(box);setTimeout(()=>box.remove(),4000);
  }
  $('resReview').innerHTML=Q.miss.length?'<span class="lbl">Yang perlu diulang</span>'+Q.miss.map(m=>`<div><span class="x">✕</span> ${esc(m)}</div>`).join(''):'';
  $('missionMsg').hidden=true;$('unlockBtn').hidden=true;
  if(NATIVE&&CFG){
    const cur=S.cur==='cam'?'Cambridge':'Merdeka';
    const title=isMix?`Misi campuran (${cur})`:Q.cfg.type==='m'?(mathSet().find(m=>m.id===Q.cfg.id)||{t:'Matematika'}).t:'B. Inggris: '+ENG[Q.cfg.id].t;
    const msg=$('missionMsg');msg.hidden=false;
    if(isMix){
      try{NATIVE.reportSet(title,r,N)}catch(e){}
      loadCfg();
      if(r<CFG.minCorrect) msg.textContent=`Untuk misi, butuh minimal ${CFG.minCorrect} benar. Ayo coba sekali lagi!`;
      else if(CFG.done<CFG.sets) msg.textContent=`Misi ${CFG.done}/${CFG.sets} selesai. Kerjakan ${CFG.sets-CFG.done} misi campuran lagi!`;
      else{msg.textContent=`Misi selesai! Tablet bisa dipakai ${CFG.minutes} menit.`;$('unlockBtn').hidden=false}
    }else{
      try{if(NATIVE.logSet)NATIVE.logSet(title,r,N)}catch(e){}
      msg.textContent='Latihan ini untuk berlatih saja. Untuk membuka tablet, kerjakan Misi campuran di halaman awal.';
    }
  }
  show('vResult');
}

renderHome();
})();
</script>
