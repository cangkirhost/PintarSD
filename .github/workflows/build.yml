name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Extract project zip (if uploaded)
        run: |
          Z=$(find . -name "*.zip" -not -path "./.git/*" | head -n 1)
          if [ ! -d app ] && [ -n "$Z" ]; then
            echo "Membongkar: $Z"
            unzip -q -o "$Z" -d _zip
            SRC=$(dirname "$(find _zip -name settings.gradle | head -n 1)")
            cp -r "$SRC"/. .
            rm -rf _zip
          fi
          ls -la
          test -d app || { echo "Folder app tidak ditemukan. Upload folder app atau file zip proyek."; exit 1; }

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Siapkan Android SDK (sudah terpasang di server GitHub)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          echo "Memakai $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      # Kunci tanda tangan tetap dari Settings → Secrets and variables → Actions.
      # Tanpa secret ini APK tetap jadi, tapi memakai kunci acak (tidak bisa menimpa versi lama).
      - name: Siapkan kunci tanda tangan
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pintarsd.keystore"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/pintarsd.keystore" >> "$GITHUB_ENV"
            echo "Kunci tanda tangan tetap dipakai."
          else
            echo "::warning::Secret SIGNING_KEYSTORE_B64 belum diisi. APK memakai kunci acak dan tidak bisa dipasang menimpa versi lama."
          fi

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: gradle assembleDebug --no-daemon

      - name: Cek tanda tangan APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK" | grep -E "Signer #1 certificate (DN|SHA-256)" || true
          mv "$APK" "app/build/outputs/apk/debug/PintarSD-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: PintarSD-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/PintarSD-*.apk
