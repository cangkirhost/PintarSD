name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Extract project zip (if uploaded)
        run: |
          Z=$(find . -name "*.zip" -not -path "./.git/*" | head -n 1)
          if [ ! -d app ] && [ -n "$Z" ]; then
            echo "Membongkar: $Z"
            unzip -q -o "$Z" -d _zip
            SRC=$(dirname "$(find _zip -name settings.gradle | head -n 1)")
            cp -r "$SRC"/. .
            rm -rf _zip
          fi
          ls -la
          test -d app || { echo "Folder app tidak ditemukan. Upload folder app atau file zip proyek."; exit 1; }
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Siapkan Android SDK (sudah terpasang di server GitHub)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          echo "Memakai $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PintarSD-apk
          path: app/build/outputs/apk/debug/app-debug.apk
